<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explanation-Guided Extraction — Project Status &amp; Roadmap</title>
<style>
  :root{
    --ink:#1a1f2b; --muted:#5b6472; --line:#e2e6ee; --bg:#f7f8fb; --card:#ffffff;
    --accent:#3d5afe; --accent2:#00897b; --good:#2e7d32; --bad:#c62828; --warn:#b26a00;
    --chip:#eef1f8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:#0f1220; overflow:hidden;
  }
  #stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}
  .slide{
    position:absolute; width:min(1120px,94vw); height:min(700px,92vh);
    background:var(--bg); border-radius:16px; padding:44px 54px;
    box-shadow:0 20px 60px rgba(0,0,0,.45); overflow:auto;
    opacity:0; transform:translateY(14px) scale(.985); pointer-events:none;
    transition:opacity .28s ease, transform .28s ease;
  }
  .slide.active{opacity:1; transform:none; pointer-events:auto;}
  h1{font-size:40px; line-height:1.12; margin:0 0 8px;}
  h2{font-size:29px; line-height:1.15; margin:0 0 4px;}
  h2 .sec{color:var(--accent); font-weight:800; letter-spacing:.02em;}
  .kicker{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent2); font-weight:700; margin-bottom:10px;}
  .sub{color:var(--muted); font-size:17px; margin:6px 0 18px;}
  p,li{font-size:18px; line-height:1.5;}
  ul{margin:8px 0 0; padding-left:22px}
  li{margin:7px 0}
  .lead{font-size:22px; line-height:1.45}
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:26px}
  .cols3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px;}
  .card h3{margin:0 0 8px; font-size:19px}
  .chip{display:inline-block; background:var(--chip); border:1px solid var(--line); border-radius:999px;
        padding:3px 12px; font-size:13px; color:var(--muted); margin:0 6px 6px 0; font-weight:600}
  .accent{color:var(--accent)} .accent2{color:var(--accent2)}
  .good{color:var(--good); font-weight:700} .bad{color:var(--bad); font-weight:700} .warn{color:var(--warn); font-weight:700}
  .callout{border-left:4px solid var(--warn); background:#fff7ec; padding:12px 16px; border-radius:8px; margin-top:14px; font-size:16px}
  .callout.good{border-color:var(--good); background:#eef8ef}
  .callout.bad{border-color:var(--bad); background:#fdeeee}

  th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.03em}
  td.n{font-variant-numeric:tabular-nums}
  .fig{display:flex; gap:16px; margin-top:8px; flex-wrap:wrap}
  .fig figure{margin:0; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px; width:330px}
  .fig img{width:100%; display:block; border-radius:6px}
  .fig figcaption{font-size:13px; color:var(--muted); margin-top:6px; text-align:center}
  .strip{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px}
  .strip figure{margin:0; width:150px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px}
  .strip img{width:100%; display:block; border-radius:4px}
  .strip figcaption{font-size:11px; color:var(--muted); text-align:center; margin-top:4px}

  .divider .sub{color:#c7d0ee}

  .footer{position:absolute; bottom:14px; left:54px; right:54px; display:flex; justify-content:space-between;

  .nav button{background:#20243a; color:#cdd4ee; border:1px solid #333a5c; border-radius:8px;
    padding:6px 12px; font-size:14px; cursor:pointer}
  .nav button:hover{background:#2b3050}
  #counter{color:#9aa3c7; font-size:13px; font-variant-numeric:tabular-nums; min-width:56px; text-align:center}
  #progress{position:fixed; top:0; left:0; height:3px; background:var(--accent); z-index:11; transition:width .28s}
  .paperbadge{font-size:12px; font-weight:800; letter-spacing:.08em; padding:2px 9px; border-radius:6px; color:#fff}
  .pa{background:#3d5afe} .pb{background:#00897b} .pc{background:#8e24aa}
  .status{font-size:13px; font-weight:700}

  kbd{background:#eceff6; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; font-size:12.5px; font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div id="progress"></div>
<div id="stage"></div>
<div class="nav">
  <button onclick="go(-1)">‹ Prev</button>

  <button onclick="go(1)">Next ›</button>

<script>
const slides = [
/* 1 — TITLE */
`<div class="kicker">Project status &amp; roadmap · lab discussion</div>
 <h1>Explanation-Guided Model Extraction:<br>What leaks, and where we go next</h1>
 <p class="sub">Extending <b>Autolycus</b> — using model explanations (SHAP / LIME) as an attacker to steal a target classifier.
 Repo is named <i>FaithfulDefense</i>, but the live work is an <b>attack</b>.</p>
 <div class="cols" style="margin-top:26px">
   <div class="card"><h3>One-line thesis (candidate)</h3>
     <p class="lead">Explanations leak <span class="accent">decision thresholds</span>, not <span class="muted">boundary geometry</span>.
     LIME hands thresholds over for free; SHAP must <i>search</i> for them.</p></div>
   <div class="card"><h3>Goal of this talk</h3>
     <ul>
       <li>Lay out what we've <b>built &amp; learned</b> — honestly, dead-ends included</li>
       <li>Put <b>three candidate papers</b> side by side</li>
       <li>Decide together <b>which to push first</b></li>
     </ul></div>
 </div>
 <div class="footer"><span>Use <kbd>→</kbd>/<kbd>←</kbd> or click. <kbd>F</kbd> fullscreen.</span><span>2026-07</span></div>`,

/* 2 — BACKGROUND */
`<div class="kicker">Background</div>
 <h2>Model extraction, and what Autolycus does</h2>
 <p class="sub">Attacker queries a target model, collects labels, trains a <b>surrogate</b>. Success = surrogate/target agreement (<b>fidelity</b>) at a fixed query budget Q.</p>
 <div class="cols">
   <div class="card"><h3>Autolycus (the base we extend)</h3>
     <ul>
       <li>Uses LIME/SHAP as a <b>feature-importance ranking</b></li>
       <li>Perturbs the top-k features by <b>fixed ±ε</b></li>
       <li><b>No explicit boundary targeting</b></li>
     </ul>
     <p class="pathref">Oksuz, Halimi, Ayday — PoPETs 2024</p>
   </div>
   <div class="card"><h3>Our angle</h3>
     <ul>
       <li>Treat the explanation as <b>boundary information</b>, not just a ranking</li>
       <li>Add <b>diverse-sample generation</b> + <b>boundary search</b> on top of the traversal</li>
       <li>Ask the mechanistic question: <i>what channel actually leaks?</i></li>
     </ul>
   </div>
 </div>
 <div class="callout"><b>Datasets/models in play:</b> adult, nursery, mushroom, breast, crop, iris × {LR, NB, KNN, Perceptron, DT, RF}. Mix of categorical and continuous.</div>`,

/* 3 — STARTING NEGATIVE RESULT */
`<div class="kicker">The starting point</div>
 <h2>SHAP feature-ranking ≈ random</h2>
 <p class="sub">The result that motivated everything: swapping SHAP importance for a random feature choice inside the traversal barely moves fidelity.</p>
 <div class="cols">
   <div class="card"><h3>What this rules out</h3>
     <ul>
       <li>The leak is <b>not</b> in the SHAP <b>ranking</b> of features</li>
       <li>SHAP-in-traverse is at best neutral, sometimes <span class="bad">harmful</span></li>
     </ul>
     <div class="callout good"><b>Reframed positively:</b> the gain that <i>does</i> exist comes from <b>boundary sampling</b> — <i>where</i> you query, not <i>which feature</i> SHAP ranks first.</div>
   </div>
   <div class="card"><h3>So the real questions become</h3>
     <ul>
       <li>Can we make SHAP useful by reading it as <b>geometry</b>? <span class="two-line">(Thread 1)</span></li>
       <li>Does <b>LIME</b> leak something SHAP doesn't? <span class="two-line">(Thread 2 + mechanism)</span></li>
       <li>Where do the <b>robust</b> wins actually live? <span class="two-line">(Thread 3)</span></li>
     </ul>
   </div>
 </div>
 <p class="pathref" style="margin-top:14px">Source: SESSION_NOTES_CORRECTION_2026-07 §3.13 — the project's cleanest, leak-free result.</p>`,

/* 4 — MAP OF THREADS */
`<div class="kicker">Orientation</div>
 <h2>Four experimental threads, one map</h2>
 <div class="cols">
   <div class="card"><h3>① SHAP as geometry</h3><p>Reconstruct the boundary <b>normal</b> from batched SHAP. <span class="bad">Dead-end for fidelity</span> — new direction, no gain.</p></div>
   <div class="card"><h3>② LIME3 method</h3><p>LIME-threshold <b>diverse</b> generation + LIME <b>boundary</b> bisection on the traversal. <span class="good">Best figures</span> (preliminary).</p></div>
   <div class="card"><h3>③ Mechanism study</h3><p><i>Why</i> does LIME help? Geometry refuted → <b>threshold leak</b>, model-dependent.</p></div>
   <div class="card"><h3>④ Boundary-sampling</h3><p>Robust non-tree wins from query <i>placement</i> (not SHAP's signal) + tree densification (narrow, honest).</p></div>
 </div>
 <div class="callout">The next 6 slides walk these threads; then we line up the <b>three candidate papers</b> they feed.</div>`,

/* 5 — THREAD 1: SHAP GEOMETRY */
`<div class="kicker">Thread ① · SHAP as geometry</div>
 <h2>Batched SHAP <i>can</i> recover the boundary normal — but it's a dead-end</h2>
 <div class="cols">
   <div class="card"><h3>What works</h3>
     <ul>
       <li>Aggregate SHAP over a <b>local batch</b> → recovers true normal <b>g</b></li>
       <li><b>k = 5–10 neighbors already suffice</b> (cos ≈ 0.96–0.99, then flat)</li>
       <li>Single-sample SHAP recovers closed-form w <b>exactly</b> (validation)</li>
     </ul>
     <div class="callout"><b>Correction to the folk memory:</b> it did <i>not</i> "need ~200 samples." Small k works; the k=200 figure was a <b>prob-space artifact</b> that vanished in margin space.</div>
   </div>
   <div class="card"><h3>Why it's a dead-end</h3>
     <ul>
       <li>Works only in a <b>narrow box</b>: margin-space SHAP, <b>smooth</b> model, <b>continuous</b> features, k-local</li>
       <li>Recovered normal is <b>orthogonal</b> to the attack's perturbation dir (cos(g,p) ≈ 0) → genuinely <b>new direction</b>…</li>
       <li>…but <span class="bad">never converted to a fidelity win.</span> Direction ≠ fidelity.</li>
     </ul>
   </div>
 </div>
 <p class="pathref" style="margin-top:12px">shap-normal-diagnostic-2026-07 · SESSION_NOTES_shap_normal_batch_2026-07</p>`,

/* 6 — THREAD 2: LIME3 METHOD */
`<div class="kicker">Thread ② · the LIME3 method</div>
 <h2>LIME-threshold diverse generation + LIME boundary search</h2>
 <p class="sub">Two new pieces bolted onto the Autolycus LIME traversal (<span class="pathref">traverse_explanations_LIME3</span>).</p>
 <div class="cols">
   <div class="card"><h3>① LIME-threshold diverse samples</h3>
     <ul>
       <li>Harvest LIME <b>bin-edge thresholds</b> from seeds</li>
       <li>Generate seed-anchored candidates that <b>cross</b> thresholds into new decision cells</li>
       <li>Greedy (feature, threshold, side) <b>coverage</b> — stays on-manifold</li>
     </ul>
   </div>
   <div class="card"><h3>② LIME boundary bisection (Phase 2)</h3>
     <ul>
       <li>Cross-class pairs → bisect toward the decision boundary</li>
       <li>Adds boundary-informative training points</li>
       <li>Budget-scaled so it doesn't starve the traversal at small Q</li>
     </ul>
   </div>
 </div>
 <div class="callout good"><b>Free-lunch principle worth keeping:</b> <i>recycle-all-queried</i> — every target query, even intermediate bisection/rejection samples, is free labeled training data.</div>`,

/* 7 — THREAD 2: RESULTS */
`<div class="kicker">Thread ② · results</div>
 <h2>LIME3 beats Autolycus LIME — <span class="warn">preliminary</span></h2>
 <p class="sub" style="margin:2px 0 4px">One per dataset (wins + one honest flat case) · <span style="color:#c62828;font-weight:700">red</span>=ours, <span style="color:#1565c0;font-weight:700">blue</span>=Autolycus · full sweep next slide.</p>
 <div class="strip">
   <figure><img src="figures/lime_limediv_n3_k1/adult_NB.png" alt="adult NB"><figcaption>adult / NB</figcaption></figure>
   <figure><img src="figures/lime_limediv_n3_k1/breast_NB.png" alt="breast NB"><figcaption>breast / NB · win</figcaption></figure>
   <figure><img src="figures/lime_limediv_n3_k1/crop_LR.png" alt="crop LR"><figcaption>crop / LR · flat (honest)</figcaption></figure>
   <figure><img src="figures/lime_limediv_n3_k1/iris_NB.png" alt="iris NB"><figcaption>iris / NB · win</figcaption></figure>
   <figure><img src="figures/lime_limediv_n3_k1/mushroom_LR.png" alt="mushroom LR"><figcaption>mushroom / LR · win</figcaption></figure>
   <figure><img src="figures/lime_limediv_n3_k1/nursery_KNN.png" alt="nursery KNN"><figcaption>nursery / KNN · headline</figcaption></figure>
 </div>
 <div class="cols" style="margin-top:14px">
   <div class="card"><h3>3-way diverse-gen comparison (32 combos)</h3>
     <table>
       <tr><th>arm</th><th>fidelity</th></tr>
       <tr><td>boundary only (no diverse)</td><td class="n">0.850</td></tr>
       <tr><td>+ manifold diverse</td><td class="n">0.848</td></tr>
       <tr><td>+ <b>LIME-threshold diverse</b></td><td class="n good">0.868</td></tr>
     </table>
     <p class="two-line">Wins <b>all 6 breast</b> combos (reverses manifold's off-manifold losses).</p>
   </div>
   <div class="card"><h3 class="warn">Caveats (state them out loud)</h3>
     <ul>
       <li>+2pp is <b>confounded</b> — the arms came from <b>separate runs</b>; base LIME differs across them</li>
       <li>On a <b>linear</b> target the gain is almost entirely the <b>boundary bisection</b>, not the diverse gen</li>
       <li>Owed: one <b>paired same-seed</b> run</li>
     </ul>
   </div>
 </div>`,

/* 8 — THREAD 3: MECHANISM */
`<div class="kicker">Thread ③ · mechanism — why LIME helps</div>
 <h2>It leaks <span class="accent">thresholds</span>, not geometry — and the channel is model-dependent</h2>
 <div class="cols">
   <div class="card"><h3>The LIME − random ablation (what we explain)</h3>
     <table>
       <tr><th>combo</th><th>type</th><th>Δfid</th></tr>
       <tr><td>crop / LR</td><td>cont.</td><td class="n">−0.004</td></tr>
       <tr><td>adult / LR</td><td>mixed</td><td class="n">+0.008</td></tr>
       <tr><td>nursery / NB</td><td>cat.</td><td class="n">+0.019</td></tr>
       <tr><td>mushroom / LR</td><td>cat.</td><td class="n">+0.035</td></tr>
       <tr><td>nursery / KNN</td><td>cat.</td><td class="n good">+0.044</td></tr>
     </table>
     <p class="two-line">Gain concentrates on <b>categorical + non-tree</b>; ~0 on continuous.</p>
   </div>
   <div class="card"><h3>Three diagnostics → one story</h3>
     <ul>
       <li><b>Geometry refuted:</b> LIME does <i>not</i> recover the normal better than SHAP (adult/MLP: SHAP 0.97 &gt; LIME 0.66)</li>
       <li><b>Feature selection:</b> real (LIME &gt; random in 6/6) but doesn't predict the <i>magnitude</i></li>
       <li><b>Threshold channel:</b> smooth models (LR/NB) → win is <b>feature choice</b>; piecewise (KNN) → win is the <b>bin edge</b></li>
     </ul>
   </div>
 </div>
 <div class="callout"><b>Headline:</b> SHAP is magnitude-only → no threshold → to match LIME it must <b>search</b> (bisection). <span class="warn">Caveat:</span> crossing-rate is a <i>proxy</i> for fidelity; 6-combo design; within-categorical ordering unexplained.</div>`,

/* 9 — THREAD 4: ROBUST RESULT */
`<div class="kicker">Thread ④ · the robust result</div>
 <h2>The robust win is boundary-<i>sampling</i> — <span class="accent">not</span> SHAP's signal</h2>
 <p class="sub">The SHAP3 <b>method</b> beats Autolycus by a lot on non-tree models — but the active ingredient is <b>where</b> it queries, not the SHAP attribution.</p>
 <div class="cols">
   <div class="card"><h3 class="good">SHAP3 method − Autolycus baseline</h3>
     <table>
       <tr><th>model</th><th>gain</th></tr>
       <tr><td>Logistic Regression</td><td class="n good">+6 … +13%</td></tr>
       <tr><td>Perceptron</td><td class="n good">up to +12%</td></tr>
       <tr><td>Naive Bayes</td><td class="n">+2 … +6%</td></tr>
       <tr><td>KNN</td><td class="n">+1 … +4%</td></tr>
     </table>
     <p class="two-line">Robust at Q=500 and Q=1000; leak-free (reps=1).</p>
   </div>
   <div class="card"><h3 class="warn">Reconciling with "SHAP ≈ random"</h3>
     <ul>
       <li>Both are true. Autolycus <b>already</b> uses SHAP ranking, so the delta isolates the <b>added sampling</b>, not the ranking.</li>
       <li>Ablations: SHAP feature-ranking ≈ <b>random</b>; SHAP-in-traverse is mildly <span class="bad">harmful</span>.</li>
       <li>Active ingredient = <b>diverse gen + boundary bisection</b> (query placement). Decompose: the fix is almost all the <b>boundary bisection</b>.</li>
     </ul>
   </div>
 </div>
 <div class="callout good"><b>This sharpens the thesis:</b> the value is in <b>where you sample</b> (on the boundary), not in the explanation's attribution. "SHAP3" wins <i>despite</i> SHAP's signal, not because of it.</div>`,

/* 10 — RIGOR */
`<div class="kicker">Rigor · what survived scrutiny</div>
 <h2>The winner's-curse correction</h2>
 <div class="cols">
   <div class="card"><h3 class="bad">The bug</h3>
     <ul>
       <li>Eval fit many surrogate refits, scored each on the test set, reported the <b>max</b></li>
       <li>Test set used <b>twice</b> (select + report) → upward bias that <b>doesn't cancel</b> in A−B</li>
       <li>Fix: aggregate by <b>mean</b>. Non-tree (reps=1) unaffected.</li>
     </ul>
   </div>
   <div class="card"><h3>What survived on trees</h3>
     <ul>
       <li>Most tree "wins" <b>evaporated</b> under mean</li>
       <li>Only <b>adult + RF</b> densification survives: <span class="good">+1.4–2.1pp vs base, +2–2.6pp vs SHAP3</span>, budget-stable</li>
       <li>Non-tree results <b>untouched</b> — still the strongest card</li>
     </ul>
   </div>
 </div>
 <div class="callout good"><b>Why show this to colleagues:</b> it's a credibility asset — we caught our own leak, and we know exactly which claims are safe.</div>`,

/* 11 — ROADMAP DIVIDER */
`<div class="divider" style="height:100%">
 <div class="kicker">Decision time</div>
 <h1>Three candidate papers</h1>
 <p class="sub">Same evidence base, three ways to cut it. Which do we push first?</p>
 <div class="cols3" style="margin-top:26px">
   <div class="card" style="background:#1b1f38;border-color:#33395c">
     <span class="paperbadge pa">PAPER A</span>
     <h3 style="color:#fff;margin-top:10px">Attack + mechanism</h3>
     <p style="color:#c7d0ee">"Extraction leaks thresholds, not geometry."</p></div>
   <div class="card" style="background:#12312c;border-color:#245049">
     <span class="paperbadge pb">PAPER B</span>
     <h3 style="color:#fff;margin-top:10px">Threshold defense</h3>
     <p style="color:#bfe6df">Blur the bins → FaithfulDefense pays off.</p></div>
   <div class="card" style="background:#2a1633;border-color:#4d2a5c">
     <span class="paperbadge pc">PAPER C</span>
     <h3 style="color:#fff;margin-top:10px">SHAP must search</h3>
     <p style="color:#e6cff0">SHAP4b / TRA boundary densification.</p></div>
 </div>
 </div>`,

/* 12 — PAPER A */
`<span class="paperbadge pa">PAPER A</span>
 <h2 style="margin-top:10px">Attack + mechanism — <span class="accent">strongest, most complete</span></h2>
 <p class="sub">Thesis: explanation-guided extraction leaks <b>decision thresholds</b>, not boundary geometry.</p>
 <div class="cols">
   <div class="card"><h3 class="good">Evidence already in hand</h3>
     <ul>
       <li>LIME3 method + figures (Thread 2)</li>

/* --- full-sweep gallery slide (all dataset × model curves), inserted after slide 7 --- */
const galleryData = [
  ["adult",    ["DT","KNN","NB","P","RF"]],
  ["breast",   ["DT","KNN","LR","NB","P","RF"]],
  ["crop",     ["DT","KNN","LR","NB","P","RF"]],
  ["iris",     ["DT","KNN","LR","NB","P","RF"]],
  ["mushroom", ["DT","KNN","LR","NB","P","RF"]],
  ["nursery",  ["DT","KNN","LR","NB","P","RF"]]
];
function buildGallery(){
  const rows = galleryData.map(([ds,models])=>{
    const cells = models.map(m=>
      `<figure><img src="figures/lime_limediv_n3_k1/${ds}_${m}.png" alt="${ds} ${m}"><figcaption>${m}</figcaption></figure>`
    ).join("");
    return `<div class="grow"><span class="dslabel">${ds}</span><div class="gstrip">${cells}</div></div>`;
  }).join("");
  return `<div class="kicker">Thread ② · full sweep</div>
   <h2>All 35 curves — every dataset × model</h2>
   <p class="sub" style="margin:2px 0 6px"><span style="color:#c62828;font-weight:700">red</span> = LIME3+limediv (ours) · <span style="color:#1565c0;font-weight:700">blue</span> = Autolycus LIME · fidelity vs queries Q · n=3/class, k=1. (adult has no LR run.) &nbsp;<b>🖐 drag or scroll to pan ↔ ↕</b> · use Prev/Next or ← → to leave this slide.</p>
   <div class="gallery">${rows}</div>`;
}
slides.splice(7, 0, buildGallery());

let i = 0;
const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');

function render(){
  stage.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'slide active';
  el.innerHTML = slides[i];
  stage.appendChild(el);
  counter.textContent = (i+1) + ' / ' + slides.length;
  progress.style.width = ((i+1)/slides.length*100) + '%';
}
function go(d){
  i = Math.max(0, Math.min(slides.length-1, i+d));
  render();
}
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') { go(1); e.preventDefault(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp') { go(-1); e.preventDefault(); }
  else if(e.key==='Home'){ i=0; render(); }
  else if(e.key==='End'){ i=slides.length-1; render(); }
  else if(e.key.toLowerCase()==='f'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
/* drag-to-pan for the oversized gallery slide (scrolls the .slide in both axes) */
let panning=false, wasDragging=false, panEl=null, sx=0, sy=0, sl=0, st=0;
stage.addEventListener('mousedown', e=>{
  const slideEl = e.target.closest('.slide');
  if(!slideEl || !e.target.closest('.gallery')) return;
  panning=true; wasDragging=false; panEl=slideEl;
  sx=e.clientX; sy=e.clientY; sl=slideEl.scrollLeft; st=slideEl.scrollTop;
  e.preventDefault();
});
window.addEventListener('mousemove', e=>{
  if(!panning) return;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.abs(dx)>4 || Math.abs(dy)>4) wasDragging=true;
  panEl.scrollLeft = sl - dx; panEl.scrollTop = st - dy;
});
window.addEventListener('mouseup', ()=>{ panning=false; });

/* click advances slides — but NOT on the gallery (so drag/scroll works there) */
stage.addEventListener('click', e=>{
  if(e.target.closest('.gallery') || wasDragging){ wasDragging=false; return; }
  if(e.clientX > window.innerWidth*0.5) go(1); else go(-1);
});
render();
</script>
