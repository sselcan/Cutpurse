<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explanation-Guided Extraction — status &amp; open problems</title>
<style>
  :root{
    --ink:#1a1f2b; --muted:#5b6472; --line:#e2e6ee; --bg:#f7f8fb; --card:#ffffff;
    --accent:#3d5afe; --accent2:#00897b; --good:#2e7d32; --bad:#c62828; --warn:#b26a00; --chip:#eef1f8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink); background:#0f1220; overflow:hidden;}
  #stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}
  .slide{position:absolute; width:min(1120px,94vw); height:min(700px,92vh);
    background:var(--bg); border-radius:16px; padding:44px 54px; box-shadow:0 20px 60px rgba(0,0,0,.45);
    overflow:auto; opacity:0; transform:translateY(14px) scale(.985); pointer-events:none;
    transition:opacity .28s ease, transform .28s ease;}
  .slide.active{opacity:1; transform:none; pointer-events:auto;}
  h1{font-size:40px; line-height:1.14; margin:0 0 10px;}
  h2{font-size:30px; line-height:1.15; margin:0 0 6px;}
  .kicker{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent2); font-weight:700; margin-bottom:12px;}
  .sub{color:var(--muted); font-size:18px; margin:6px 0 16px;}
  .lead{font-size:22px; line-height:1.45}
  p,li{font-size:18px; line-height:1.48;}
  ul{margin:8px 0 0; padding-left:22px} li{margin:8px 0}
  ul ul{margin:4px 0} ul ul li{margin:3px 0; font-size:16.5px; color:#374151}
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:24px}
  .cols3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 22px;}
  .card.tight{padding:14px 18px}
  .card h3{margin:0 0 8px; font-size:19px}
  .accent{color:var(--accent)} .accent2{color:var(--accent2)}
  .good{color:var(--good); font-weight:700} .bad{color:var(--bad); font-weight:700} .warn{color:var(--warn); font-weight:700}
  .chip{display:inline-block; background:var(--chip); border:1px solid var(--line); border-radius:999px;
        padding:4px 13px; font-size:14px; color:var(--muted); margin:0 6px 8px 0; font-weight:600}
  .callout{border-left:4px solid var(--accent); background:#eef1fe; padding:12px 18px; border-radius:8px; margin-top:14px; font-size:16.5px}
  .callout.good{border-color:var(--good); background:#eef8ef}
  .callout.warn{border-color:var(--warn); background:#fff7ec}
  .callout.bad{border-color:var(--bad); background:#fdeeee}
  table{border-collapse:collapse; width:100%; margin-top:8px; font-size:15.5px}
  th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:.03em}
  td.n{font-variant-numeric:tabular-nums}
  .fig{display:flex; gap:20px; align-items:center}
  .fig figure{margin:0; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px; width:360px}
  .fig img{width:100%; display:block; border-radius:6px}
  .fig figcaption{font-size:13px; color:var(--muted); margin-top:6px; text-align:center}
  /* full-sweep gallery (pannable) */
  .gallery{display:flex; flex-direction:column; gap:12px; margin-top:8px; width:max-content; cursor:grab; user-select:none}
  .gallery:active{cursor:grabbing}
  .grow{display:flex; align-items:center; gap:14px}
  .dslabel{writing-mode:vertical-rl; transform:rotate(180deg); font-size:15px; font-weight:800; color:var(--accent);
           text-transform:uppercase; letter-spacing:.09em; min-width:20px; text-align:center}
  .gstrip{display:flex; gap:12px; flex-wrap:nowrap}
  .gstrip figure{margin:0; width:300px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:7px}
  .gstrip img{width:100%; display:block; border-radius:4px; pointer-events:none}
  .gstrip figcaption{font-size:14px; color:var(--muted); text-align:center; margin-top:5px; font-weight:600}
  /* heatmap results tables */
  .htab{border-collapse:collapse; width:100%; margin-top:2px; font-size:15px}
  .htab caption{caption-side:top; text-align:left; font-size:12.5px; font-weight:700; color:var(--muted);
                text-transform:uppercase; letter-spacing:.04em; padding:2px 0 5px}
  .htab th{color:var(--muted); font-weight:700; font-size:12px; text-transform:uppercase; padding:4px 6px; text-align:center; border:none}
  .htab td{text-align:center; padding:6px 6px; font-variant-numeric:tabular-nums; border:2px solid var(--bg); border-radius:4px; font-weight:600}
  .htab td.rl{background:var(--chip); color:var(--ink); font-weight:700; text-align:right}
  .matrix{display:grid; grid-template-columns:120px 1fr 1fr; gap:10px; margin-top:12px}
  .matrix>div{padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:16px}
  .matrix .hd{background:var(--chip); font-weight:700; color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.03em; display:flex; align-items:center}
  .matrix .rl{background:var(--chip); font-weight:700; display:flex; align-items:center}
  .footer{position:absolute; bottom:14px; left:54px; right:54px; display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted)}
  .pathref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; color:var(--muted)}
  .nav{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:14px; align-items:center; z-index:10}
  .nav button{background:#20243a; color:#cdd4ee; border:1px solid #333a5c; border-radius:8px; padding:6px 12px; font-size:14px; cursor:pointer}
  .nav button:hover{background:#2b3050}
  #counter{color:#9aa3c7; font-size:13px; font-variant-numeric:tabular-nums; min-width:56px; text-align:center}
  #progress{position:fixed; top:0; left:0; height:3px; background:var(--accent); z-index:11; transition:width .28s}
  kbd{background:#eceff6; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; font-size:12.5px; font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div id="progress"></div>
<div id="stage"></div>
<div class="nav">
  <button onclick="go(-1)">‹ Prev</button>
  <span id="counter"></span>
  <button onclick="go(1)">Next ›</button>
</div>

<script>
const slides = [
/* 1 — TITLE */
`<div class="kicker">Research status · explanation-guided model extraction</div>
 <h1>Stealing a classifier from its own explanations</h1>
 <p class="sub">An offensive study: when a model returns SHAP / LIME explanations alongside predictions, how much easier is it to
 <b>extract</b> the model? We extend <b>Autolycus</b> (PoPETs 2024) with explanation-guided <b>boundary search</b> + <b>diverse sampling</b>.</p>
 <div style="margin-top:20px">
   <span class="chip">Baseline: Autolycus</span>
   <span class="chip">SHAP path</span>
   <span class="chip">LIME path</span>
   <span class="chip">Ablations</span>
   <span class="chip">Open: how to frame the paper</span>
 </div>
 <div class="callout"><b>Honest one-liner:</b> the <b>LIME</b> side works and has a clean "why"; the <b>SHAP</b> side works too — but the ablations say it isn't the SHAP signal doing the work. That tension is the crux of today.</div>
 <div class="footer"><span><kbd>→</kbd>/<kbd>←</kbd> or click · <kbd>F</kbd> fullscreen</span><span>11 slides</span></div>`,

/* 2 — SETTING */
`<div class="kicker">The setting (30 seconds)</div>
 <h2>Model extraction, guided by explanations</h2>
 <div class="cols">
   <div class="card"><h3>What happens</h3>
     <ul>
       <li>A deployed model answers queries with a <b>prediction + an explanation</b> (SHAP or LIME)</li>
       <li>An attacker queries it, collects <b>(input, label)</b> pairs, trains a <b>surrogate</b></li>
       <li>Explanations may reveal <i>how</i> the model decides → fewer queries needed</li>
     </ul>
   </div>
   <div class="card"><h3>How we score it</h3>
     <ul>
       <li><b>Fidelity</b> = surrogate-vs-target agreement on a test set</li>
       <li>At a fixed <b>query budget Q</b> (queries are the attacker's cost)</li>
       <li>Better attack = <b>higher fidelity per query</b></li>
     </ul>
   </div>
 </div>
 <div class="callout">Datasets: adult, nursery, mushroom, breast, crop, iris. Targets: LR, NB, KNN, Perceptron, Decision Tree, Random Forest.</div>`,

/* 3 — BASELINE: AUTOLYCUS */
`<div class="kicker">Baseline</div>
 <h2>Autolycus — the method we extend</h2>
 <div class="cols">
   <div class="card"><h3>The loop</h3>
     <ul>
       <li>Start from a few <b>seed samples</b></li>
       <li>Query the target → get label <b>+ explanation</b></li>
       <li>Explanation → <b>rank the features</b> by importance</li>
       <li>Perturb the <b>top-k features by ±ε</b> → new candidate samples</li>
       <li>Repeat until budget; train surrogate on everything queried</li>
     </ul>
   </div>
   <div class="card"><h3>Its limitations (our openings)</h3>
     <ul>
       <li>Explanation used only as a <b>ranking</b> — a coarse signal</li>
       <li><b>Fixed ±ε</b>, no notion of <i>where</i> the boundary is</li>
       <li>Can leave the <b>decision boundary poorly sampled</b> and some regions never visited</li>
     </ul>
   </div>
 </div>
 <div class="callout"><b>Our two additions</b> (applied with both SHAP and LIME): <b>(1) boundary finding</b> — put samples near the decision boundary; <b>(2) diverse generation</b> — cover more of the space / more decision cells.</div>`,

/* 4 — EXTENSION OVERVIEW */
`<div class="kicker">What I added</div>
 <h2>Two building blocks × two explainers</h2>
 <div class="matrix">
   <div class="hd"></div><div class="hd">Boundary finding</div><div class="hd">Diverse generation</div>
   <div class="rl">SHAP</div>
   <div>SHAP-informed cross-class mixing + <b>bisection</b>; counterfactual <b>flip</b> → straddle pairs → threshold <b>densification</b></div>
   <div>Manifold-aware diverse samples (crossover + mutation, plausibility filter); SHAP-directed variants</div>
   <div class="rl">LIME</div>
   <div>LIME-guided <b>bisection</b> toward the boundary (uses LIME's local linear model)</div>
   <div><b>LIME-threshold</b> diverse: cross the bin edges LIME reveals into <b>new decision cells</b></div>
 </div>
 <div class="callout">Goal of both blocks: turn queries into <b>boundary-informative, well-spread</b> training points — the thing Autolycus's fixed-ε ranking walk misses.</div>`,

/* 5 — SHAP APPROACH */
`<div class="kicker">What I tried · SHAP path</div>
 <h2>SHAP-guided boundary search + diverse sampling</h2>
 <div class="cols">
   <div class="card"><h3>Boundary finding</h3>
     <ul>
       <li><b>Cross-class pairs</b> → mix features by SHAP importance → <b>bisect</b> toward the boundary (softly labelled midpoints)</li>
       <li><b>Counterfactual flip:</b> greedily flip the highest-SHAP feature to walk A→B → a <b>straddle pair</b> that localizes the boundary <i>axis</i></li>
       <li><b>Densify</b> points around that threshold — an oracle-free, <b>TRA-style</b> reconstruction</li>
     </ul>
   </div>
   <div class="card"><h3>Diverse generation</h3>
     <ul>
       <li>Manifold-aware crossover + mutation, kept on-manifold by a <b>plausibility filter</b></li>
       <li>Filter to <b>confident</b> samples (clear labels)</li>
       <li>SHAP-directed variants that step along SHAP directions</li>
     </ul>
   </div>
 </div>
 <div class="callout">Also: <b>recycle every queried point</b> (even intermediate bisection/flip samples) as free labelled training data — a clean, reusable trick.</div>`,

/* 6 — LIME APPROACH */
`<div class="kicker">What I tried · LIME path</div>
 <h2>LIME-enhanced boundary search + diverse sampling</h2>
 <div class="cols">
   <div class="card"><h3>Boundary finding</h3>
     <ul>
       <li>LIME's local linear model gives a <b>feature + a threshold (bin edge)</b>, not just a ranking</li>
       <li>Snap to the bin edge, then <b>bisect ±ε across it</b> → land on the boundary</li>
     </ul>
   </div>
   <div class="card"><h3>Diverse generation (the new piece)</h3>
     <ul>
       <li><b>Harvest LIME's bin-edge thresholds</b> from the seed samples</li>
       <li>Generate seed-anchored candidates that <b>cross a threshold into a new decision cell</b></li>
       <li>Greedy <b>(feature, threshold, side) coverage</b> — stays on-manifold (anchored to real data)</li>
     </ul>
   </div>
 </div>
 <div class="callout">Combined with the Autolycus LIME traversal → our <b>"LIME3"</b> attack. The threshold channel is what LIME gives for free that SHAP does not.</div>`,

/* 7 — RESULTS */
`<div class="kicker">Results · what works</div>
 <h2>The method beats Autolycus — clearest on non-tree targets</h2>
 <div class="fig">
   <figure><img src="figures/lime_limediv_n3_k1/nursery_KNN.png" alt="nursery KNN"><figcaption>nursery / KNN · fidelity vs queries — red = ours, blue = Autolycus</figcaption></figure>
   <div style="flex:1">
     <table>
       <tr><th>target</th><th>gain vs Autolycus</th></tr>
       <tr><td>Logistic Regression</td><td class="n good">+6 … +13%</td></tr>
       <tr><td>Perceptron</td><td class="n good">up to +12%</td></tr>
       <tr><td>Naive Bayes</td><td class="n">+2 … +6%</td></tr>
       <tr><td>KNN</td><td class="n">+1 … +4%</td></tr>
     </table>
     <p style="font-size:15.5px; margin-top:10px">Robust across query budgets. On the LIME side, the <b>threshold-diverse</b> generator adds <b>~+2pp</b> over no-diverse / plain manifold and <b>wins all breast combos</b>.</p>
   </div>
 </div>
 <div class="callout good">Same query budget, better stolen model — the metric that matters for extraction. <b>Full SHAP results table and all LIME curves on the next two slides.</b></div>`,

/* 8 — PROBLEM 1: SHAP */
`<div class="kicker">Problem 1</div>
 <h2>SHAP "works" — but the ablations say it isn't <i>SHAP</i> doing it</h2>
 <div class="cols">
   <div class="card"><h3 class="warn">The awkward finding</h3>
     <ul>
       <li>Swap SHAP's feature ranking for a <b>random</b> choice → <b>~same fidelity</b>. SHAP-in-the-loop is even mildly <span class="bad">harmful</span>.</li>
       <li>The gain comes from <b>where we sample</b> (the boundary), not from SHAP's attribution.</li>
       <li>Caveat that softens it: <b>Autolycus doesn't really use SHAP either</b> — random ranking ≈ SHAP ranking there too. So we're not <i>worse</i> — but "SHAP is the key" is not a claim we can make.</li>
     </ul>
   </div>
   <div class="card"><h3>The one place SHAP <i>does</i> carry the boundary</h3>
     <ul>
       <li><b>Clustered / aggregated SHAP:</b> averaging SHAP over a local neighborhood recovers the true boundary <b>normal</b> far better than a single sample (k≈5–10 → cosine <b>0.96–0.99</b>)</li>
       <li>So clustering <b>does extract more boundary geometry</b>…</li>
       <li>…but only in a <b>narrow regime</b> (smooth model, continuous features), it's a <b>new direction</b> we never converted to a fidelity gain. <span class="warn">More info, still not enough.</span></li>
     </ul>
   </div>
 </div>`,

/* 9 — PROBLEM 2: LIME + PAPER DILEMMA */
`<div class="kicker">Problem 2 · and the writing question</div>
 <h2>LIME works — but is it enough, and how do we frame a paper?</h2>
 <div class="cols">
   <div class="card"><h3 class="warn">Is the LIME result strong enough?</h3>
     <ul>
       <li>Gains are <b>real</b> and have a clean mechanism, but <b>modest (~+2pp)</b> on the diverse side</li>
       <li><b>Preliminary:</b> confounded across runs — needs one paired same-seed re-run</li>
       <li>On a <b>linear</b> target the boundary search does the work; diverse gen ≈ 0 there</li>
     </ul>
   </div>
   <div class="card"><h3>How to write it if only one part clearly works</h3>
     <ul>
       <li><b>A — Mechanism paper:</b> "explanations leak <b>thresholds, not geometry</b>." The SHAP negative <i>becomes evidence</i> (SHAP must search) and LIME the positive (thresholds for free). <span class="good">Absorbs both sides.</span></li>
       <li><b>B — Attack paper</b> (the LIME method): needs broader / stronger numbers</li>
       <li><b>C — SHAP as a negative / diagnostic</b> contribution</li>
     </ul>
   </div>
 </div>
 <div class="callout">The mechanism framing (A) is the only one that turns the <b>SHAP disappointment into a strength</b> rather than a hole.</div>`,

/* 10 — ABLATIONS */
`<div class="kicker">Ablations · the evidence base</div>
 <h2>What we actually measured</h2>
 <div class="cols">
   <div class="card tight"><h3>LIME</h3>
     <ul>
       <li><b>LIME vs random feature choice</b> (the core phenomenon): LIME <b>helps in general</b> — picking informative features to perturb beats a random choice (<b>+0.8 … +4.4pp</b> fidelity across datasets &amp; models)</li>
       <li><b>Geometry</b> (cosine to boundary normal): <b class="bad">refuted</b> — LIME not better than SHAP (adult/MLP: SHAP 0.97 &gt; LIME 0.66)</li>
       <li><b>Feature selection:</b> real (LIME &gt; random in 6/6) but doesn't predict the <i>magnitude</i></li>
       <li><b>Threshold decomposition:</b> LIME helps via <b>two channels</b> — the feature it picks <i>and</i> the decision threshold (bin edge) it hands over for free</li>
     </ul>
   </div>
   <div class="card tight"><h3>SHAP</h3>
     <ul>
       <li><b>Feature ranking ≈ random</b> in the attack; SHAP-in-traverse mildly harmful</li>
       <li><b>Clustered normal recovery:</b> k≈5–10 recovers the true normal (narrow regime only)</li>
       <li><b>Tree densification:</b> found &amp; fixed a test-set selection leak → broad tree "wins" <b>evaporated</b>; only <b>adult+RF</b> survives (+1.4–2.1pp)</li>
     </ul>
   </div>
 </div>
 <div class="callout warn">Caveats we state openly: the mechanism uses a crossing-rate <i>proxy</i> (6 combos); the LIME method result is confounded until the paired re-run.</div>`,

/* 11 — WHERE IT STANDS */
`<div class="kicker">Where it stands</div>
 <h2>Summary</h2>
 <div class="cols3">
   <div class="card"><h3 class="good">Works</h3>
     <ul>
       <li>Query-efficient <b>boundary sampling</b> beats Autolycus on non-tree targets</li>
       <li>A clean <b>threshold-leak mechanism</b> (thresholds, not geometry)</li>
     </ul>
   </div>
   <div class="card"><h3 class="bad">Doesn't</h3>
     <ul>
       <li>SHAP's own <b>signal</b> adds ~nothing to the attack</li>
       <li>Tree gains mostly <b>evaporate</b> under a clean eval</li>
       <li>LIME magnitude is <b>modest</b></li>
     </ul>
   </div>
   <div class="card"><h3 class="accent">The crux</h3>
     <ul>
       <li>The <b>mechanism story</b> is the one framing that unifies the SHAP negative and the LIME positive</li>
       <li>Clustered SHAP + LIME thresholds are two faces of the same claim</li>
     </ul>
   </div>
 </div>
 <div class="callout">Next, regardless of framing: the paired LIME re-run, a fidelity (not proxy) check of the mechanism, and competitor baselines (XaMEA, DualCF).</div>`
];

/* ---- SHAP results (fidelity + % change vs baseline), rendered as heatmap tables ---- */
const shapCols = ['DT','LR','NB','KNN','RF','P'];
const shapRows = ['iris','crop','adult','breast','nursery','mushroom'];
const shapSim = {
  iris:    [null,   null,   0.6591, null,   null,   null  ],
  crop:    [0.9384, 0.7929, 0.7059, 0.6776, 0.9741, 0.6518],
  adult:   [0.8384, 0.8792, 0.9642, 0.8632, 0.9018, 0.8104],
  breast:  [0.9482, 0.9341, 0.9188, 0.9106, 0.9753, 0.9906],
  nursery: [0.9013, 0.9022, 0.5598, 0.5720, 0.9046, 0.8284],
  mushroom:[0.9500, 0.8224, 0.8716, 0.8135, 0.9502, 0.8801]
};
const shapPct = {
  iris:    [null,   null,   3.57,  null,   null,   null ],
  crop:    [2.66,   10.01,  5.82,  2.43,  -0.28,   2.91 ],
  adult:   [1.63,   1.12,   4.68,  1.17,   0.70,  -0.53 ],
  breast:  [1.13,  -0.50,   4.97,  2.24,   0.49,   0.24 ],
  nursery: [-0.47,  15.80,  9.03,  4.32,  -0.18,   10.44],
  mushroom:[1.74,   11.59,  0.38,  0.59,   1.55,   1.62 ]
};
function pctColor(v){
  if(v===null) return 'background:#111;color:#6b7280';
  if(v<0)   return 'background:#f4d3ce;color:#7f1d1d';
  if(v<2)   return 'background:#eaf5ea;color:#1a1f2b';
  if(v<5)   return 'background:#b7e0b7;color:#12321a';
  if(v<10)  return 'background:#69bd6d;color:#08260f';
  return 'background:#2e7d32;color:#fff';
}
function heatTable(caption, disp, fmt){
  const head = '<tr><th></th>' + shapCols.map(c=>`<th>${c}</th>`).join('') + '</tr>';
  const body = shapRows.map(r=>{
    const cells = shapCols.map((c,ci)=>{
      const dv = disp[r][ci];
      const txt = (dv===null) ? 'N/A' : fmt(dv);
      return `<td style="${pctColor(shapPct[r][ci])}">${txt}</td>`;
    }).join('');
    return `<tr><td class="rl">${r}</td>${cells}</tr>`;
  }).join('');
  return `<table class="htab"><caption>${caption}</caption>${head}${body}</table>`;
}
function buildShapResults(){
  const t1 = heatTable('Similarity / fidelity (color = % change vs baseline)', shapSim, v=>v.toFixed(4));
  const t2 = heatTable('% change vs Autolycus baseline', shapPct, v=>(v>=0?'+':'')+v.toFixed(2)+'%');
  return `<div class="kicker">Results · SHAP path — every dataset × model</div>
   <h2>SHAP method vs Autolycus baseline</h2>
   <div style="display:flex; flex-direction:column; gap:10px">${t1}${t2}</div>
   <div class="callout">Gains concentrate on <b>non-tree</b> targets (LR/NB/KNN/P): LR <b>+10 / +16 / +12%</b> on crop/nursery/mushroom, P <b>+10.4%</b> nursery, NB <b>+5–9%</b>. Trees (DT/RF) sit near <b>0</b> (some negative) — consistent with the ablation: the win is boundary <i>sampling</i>, and trees are near-ceiling.</div>`;
}

/* ---- LIME results: full-sweep pannable gallery (all dataset × model curves) ---- */
const galleryData = [
  ["adult",    ["DT","KNN","NB","P","RF"]],
  ["breast",   ["DT","KNN","LR","NB","P","RF"]],
  ["crop",     ["DT","KNN","LR","NB","P","RF"]],
  ["iris",     ["DT","KNN","LR","NB","P","RF"]],
  ["mushroom", ["DT","KNN","LR","NB","P","RF"]],
  ["nursery",  ["DT","KNN","LR","NB","P","RF"]]
];
function buildGallery(){
  const rows = galleryData.map(([ds,models])=>{
    const cells = models.map(m=>
      `<figure><img src="figures/lime_limediv_n3_k1/${ds}_${m}.png" alt="${ds} ${m}"><figcaption>${m}</figcaption></figure>`
    ).join("");
    return `<div class="grow"><span class="dslabel">${ds}</span><div class="gstrip">${cells}</div></div>`;
  }).join("");
  return `<div class="kicker">Results · LIME path — full sweep</div>
   <h2>All LIME curves — every dataset × model</h2>
   <p class="sub" style="margin:2px 0 6px"><span style="color:#c62828;font-weight:700">red</span> = our LIME method (LIME3 + threshold-diverse) · <span style="color:#1565c0;font-weight:700">blue</span> = Autolycus LIME · fidelity vs Q · n=3/class, k=1. (adult has no LR run.) &nbsp;<b>🖐 drag or scroll to pan ↔ ↕</b> · Prev/Next or ← → to leave.</p>
   <div class="gallery">${rows}</div>`;
}

/* insert SHAP-results then LIME-gallery right after the results-overview slide (index 6) */
slides.splice(7, 0, buildShapResults(), buildGallery());

let i = 0;
const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');

function render(){
  stage.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'slide active';
  el.innerHTML = slides[i];
  stage.appendChild(el);
  counter.textContent = (i+1) + ' / ' + slides.length;
  progress.style.width = ((i+1)/slides.length*100) + '%';
}
function go(d){ i = Math.max(0, Math.min(slides.length-1, i+d)); render(); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') { go(1); e.preventDefault(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp') { go(-1); e.preventDefault(); }
  else if(e.key==='Home'){ i=0; render(); }
  else if(e.key==='End'){ i=slides.length-1; render(); }
  else if(e.key.toLowerCase()==='f'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
/* drag-to-pan for the oversized LIME gallery slide */
let panning=false, wasDragging=false, panEl=null, sx=0, sy=0, sl=0, st=0;
stage.addEventListener('mousedown', e=>{
  const slideEl = e.target.closest('.slide');
  if(!slideEl || !e.target.closest('.gallery')) return;
  panning=true; wasDragging=false; panEl=slideEl;
  sx=e.clientX; sy=e.clientY; sl=slideEl.scrollLeft; st=slideEl.scrollTop; e.preventDefault();
});
window.addEventListener('mousemove', e=>{
  if(!panning) return;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.abs(dx)>4 || Math.abs(dy)>4) wasDragging=true;
  panEl.scrollLeft = sl - dx; panEl.scrollTop = st - dy;
});
window.addEventListener('mouseup', ()=>{ panning=false; });
stage.addEventListener('click', e=>{
  if(e.target.closest('.gallery') || wasDragging){ wasDragging=false; return; }
  if(e.clientX > window.innerWidth*0.5) go(1); else go(-1);
});
render();
</script>
</body>
</html>
